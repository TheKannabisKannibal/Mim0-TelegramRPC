name: Windows CI & Release

on:
  push:
    branches:
      - main
      - test/rich-presence-v2
      - test/ui-refresh-v1
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.0.0-ci.${{ github.run_number }}"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore TelegramDiscordRPC.csproj

      - name: Publish
        run: >
          dotnet publish TelegramDiscordRPC.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $publish = "bin/Release/net8.0-windows10.0.17763.0/win-x64/publish"
          $zip = "Mim0-TelegramRPC-v${{ steps.version.outputs.version }}-win-x64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$publish/*" -DestinationPath $zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mim0-TelegramRPC-v${{ steps.version.outputs.version }}-win-x64
          path: Mim0-TelegramRPC-v${{ steps.version.outputs.version }}-win-x64.zip

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            installer.iss

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Mim0-TelegramRPC v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            Mim0-TelegramRPC-v${{ steps.version.outputs.version }}-win-x64.zip
            installer-output/Mim0.TelegramRPC.Setup.exe
